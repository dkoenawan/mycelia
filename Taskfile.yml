# Taskfile.yml — cross-platform entrypoints for mycelia. See ADR-0001
# (docs/adr/0001-install-and-update-tooling.md) for why Taskfile over plain bash:
# cross-OS compatibility was the deciding driver. Install go-task first:
# https://taskfile.dev/installation/
#
# The tasks below are thin wrappers around scripts/*.sh — Taskfile solves
# invocation portability, not shell-command portability, so the actual logic
# stays in bash, sourced from scripts/lib/common.sh like every other runner.
# TypeScript runners under src/ (ADR-0007) are wrapped the same way, behind
# deps:node, which installs the pinned dependencies on first use.

version: "3"

tasks:
  install:
    desc: Seed control/*.local.yaml from the example templates (idempotent, never overwrites).
    cmds:
      - bash scripts/install.sh

  bootstrap-areas:
    desc: Create one 20-areas/ note per entry in control/areas.local.yaml (seeds it from the example if absent; never edits existing notes; needs python3+PyYAML).
    cmds:
      - bash scripts/bootstrap-areas.sh

  deps:node:
    desc: Install the pinned Node dependencies (npm ci) when package.json or package-lock.json changes.
    preconditions:
      - sh: node -e "const [a,b]=process.versions.node.split('.').map(Number);process.exit(a>22||(a===22&&b>=18)?0:1)"
        msg: "Node.js 22.18 or later is required (the ingester runs TypeScript directly). Install Node LTS, e.g. from nodejs.org or with your version manager."
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci

  ingest-inbox:
    desc: Turn items in 00-inbox/capture/ into linked 30-resources/ notes (oldest first, up to 10; needs Node and a logged-in Claude Code; never commits).
    deps: [deps:node]
    cmds:
      - node src/ingest/cli.ts

  ingest-inbox:preflight:
    desc: Check the ingester can run (folders, targets, Claude Code installed and logged in) without changing anything.
    deps: [deps:node]
    cmds:
      - node src/ingest/cli.ts --preflight

  check:node:
    desc: Quality gates for the TypeScript code (tsc strict, eslint, node:test).
    deps: [deps:node]
    cmds:
      - npm run check

  doctor:
    desc: Verify this install is healthy — config present, parses, paths resolve, dependencies found.
    cmds:
      - bash scripts/doctor.sh

  doctor:ci:
    desc: Like doctor, but skips checks that only make sense on the operator's real machine (used by release CI).
    cmds:
      - bash scripts/doctor.sh --ci

  default:
    desc: Show available tasks.
    cmds:
      - task --list
